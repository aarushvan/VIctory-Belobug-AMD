name: Windows frame and PE regression

on:
  push:
    branches: [validation/frame-event-ticks-windows]

permissions:
  contents: read

jobs:
  regressions:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test --locked -p victory-pe
      - run: cargo test --locked -p victory-gpu --all-features --lib frame::tests -- --test-threads=1
